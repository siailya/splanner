services:
  planner:
    image: ghcr.io/siailya/splanner:${IMAGE_TAG:-latest}
    platform: linux/amd64
    pull_policy: always
    init: true
    restart: unless-stopped
    environment:
      PORT: "3101"
      DB_PATH: /data/planner.sqlite
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://${DOMAIN:-splanner.samolyev.ru}}
      JSON_LIMIT: ${JSON_LIMIT:-10mb}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3101}:3101"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy_network}"
      - "traefik.http.routers.splanner.rule=Host(`${DOMAIN:-splanner.samolyev.ru}`)"
      - "traefik.http.routers.splanner.entrypoints=websecure"
      - "traefik.http.routers.splanner.tls=true"
      - "traefik.http.routers.splanner.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.splanner.service=splanner"
      - "traefik.http.routers.splanner.middlewares=splanner-https-headers"
      - "traefik.http.services.splanner.loadbalancer.server.port=3101"
      - "traefik.http.middlewares.splanner-https-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
    volumes:
      - type: bind
        source: ${DATA_DIR:-/opt/splanner/data}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy_network}
